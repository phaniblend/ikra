<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Noble Quran - Reader</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noble Quran">
  <meta name="theme-color" content="#064e3b">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Outfit:wght@300;400;500;600;700&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #064e3b;
      --primary-light: #047857;
      --accent-gold: #f59e0b;
      --accent-gold-light: #fef3c7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --read-tint: #ecfdf5;
      --read-border: #a7f3d0;
      --active-word: #fde68a;
      --active-word-border: #d97706;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --primary: #022c22;
      --primary-light: #065f46;
      --bg: #090d16;
      --surface: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --read-tint: #064e3b25;
      --read-border: #047857;
      --active-word: #78350f;
      --active-word-border: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding-top: calc(var(--safe-top) + 60px);
      padding-bottom: calc(var(--safe-bottom) + 80px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-top) + 60px);
      padding-top: var(--safe-top);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .surah-select-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      max-width: 200px;
    }

    .surah-select-trigger span.surah-num {
      background: var(--accent-gold);
      color: #000;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .icon-btn:active {
      background: rgba(255,255,255,0.2);
    }

    /* Pinned Top HUD Transliteration + Meaning Tooltip */
    #top-hud-card {
      position: sticky;
      top: calc(var(--safe-top) + 60px);
      z-index: 90;
      width: 100%;
      max-width: 680px;
      padding: 8px 16px;
      margin-bottom: 8px;
    }

    .hud-inner {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35), 0 0 12px rgba(245, 158, 11, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { transform: translateY(-12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .hud-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow: hidden;
    }

    .hud-top-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-arabic {
      font-family: 'Amiri Quran', serif;
      font-size: 26px;
      color: #fef08a;
      line-height: 1;
    }

    .hud-transliteration {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.3px;
    }

    .hud-meaning-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #f1f5f9;
      font-weight: 500;
    }

    .hud-meaning-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }

    .hud-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .hud-btn.audio-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .surah-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .surah-title-ar {
      font-family: 'Scheherazade New', serif;
      font-size: 34px;
      color: var(--primary-light);
      font-weight: 700;
    }

    .surah-meta {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-pill {
      background: var(--read-tint);
      color: var(--primary-light);
      border: 1px solid var(--read-border);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .bismillah {
      font-family: 'Amiri Quran', serif;
      font-size: 28px;
      color: var(--text-main);
      margin: 12px 0 4px;
      line-height: 1.8;
      text-align: center;
    }

    .ayah-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ayah-card.read {
      background: var(--read-tint);
      border-color: var(--read-border);
    }

    .ayah-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .ayah-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ayah-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recite-btn, .read-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .read-toggle-btn.is-read {
      background: var(--primary-light);
      color: white;
      border-color: var(--primary-light);
    }

    .ayah-arabic {
      direction: rtl;
      font-family: 'Amiri Quran', serif;
      font-size: 29px;
      line-height: 2.1;
      text-align: right;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      row-gap: 6px;
    }

    .q-word {
      display: inline-block;
      padding: 0 6px;
      margin: 0 1px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 2px solid transparent;
      user-select: none;
    }

    .q-word:active {
      transform: scale(0.96);
    }

    .q-word.active-word {
      background: var(--active-word);
      border-bottom: 2px solid var(--active-word-border);
      color: #000;
    }

    [data-theme="dark"] .q-word.active-word {
      color: #fff;
    }

    .ayah-end-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      margin-right: 6px;
      vertical-align: middle;
    }

    .ayah-translation {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 400;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-height: 85vh;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .surah-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .surah-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .surah-list-item:active {
      background: var(--bg);
    }

    .surah-list-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .surah-num-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .surah-names-col {
      display: flex;
      flex-direction: column;
    }

    .surah-names-col .en-name {
      font-size: 15px;
      font-weight: 600;
    }

    .surah-names-col .sub-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    .surah-ar-name {
      font-family: 'Scheherazade New', serif;
      font-size: 22px;
      color: var(--primary-light);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="surah-select-trigger" id="surah-trigger">
      <span class="surah-num" id="hdr-surah-num">1</span>
      <span id="hdr-surah-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Al-Fatihah</span>
      <span style="font-size: 10px; opacity:0.8;">▼</span>
    </div>

    <div class="header-icons">
      <button class="icon-btn" id="theme-toggle" title="Toggle Theme">🌓</button>
      <button class="icon-btn" id="jump-btn" title="Jump to Verse">🔢</button>
    </div>
  </header>

  <!-- Pinned Top HUD: Transliteration + Meaning -->
  <div id="top-hud-card">
    <div class="hud-inner">
      <div class="hud-content">
        <div class="hud-top-row">
          <span class="hud-arabic" id="hud-ar">بِسْمِ</span>
          <span class="hud-transliteration" id="hud-translit">Bismi</span>
        </div>
        <div class="hud-meaning-row">
          <span class="hud-meaning-label">Meaning</span>
          <span id="hud-meaning">In (the) name</span>
        </div>
      </div>
      <div class="hud-actions">
        <button class="hud-btn audio-btn" id="hud-audio-replay" title="Replay Word Audio">🔊</button>
        <button class="hud-btn" id="hud-dismiss" title="Dismiss">✕</button>
      </div>
    </div>
  </div>

  <main>
    <div class="surah-header-card" id="surah-card">
      <div class="surah-title-ar" id="card-ar-title">سُورَةُ الفَاتِحَةِ</div>
      <div class="surah-meta" id="card-meta">Al-Fatihah • 7 Verses • Revelation: Makkah</div>
      <div class="progress-pill">
        <span id="progress-indicator">0 / 7 Read (0%)</span>
      </div>
      <div class="bismillah" id="bismillah-text">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>
    </div>

    <div id="verses-container" style="display: flex; flex-direction: column; gap: 14px;"></div>

    <div class="loader-wrap" id="loader" style="display:none;">
      <div class="spinner"></div>
      <div>Loading Surah...</div>
    </div>
  </main>

  <div class="modal-backdrop" id="surah-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <strong style="font-size: 17px;">Select Surah (1 - 114)</strong>
        <button class="icon-btn" id="close-modal" style="color:var(--text-main);">✕</button>
      </div>
      <div class="modal-search-box">
        <input type="text" id="surah-search" placeholder="Search by name, number, meaning...">
      </div>
      <div class="surah-list-scroll" id="surah-list"></div>
    </div>
  </div>

      { id: 110, name: "An-Nasr", ar: "النصر", meaning: "The Divine Support", verses: 3, type: "Madinah" },

      { id: 112, name: "Al-Ikhlas", ar: "الإخلاص", meaning: "The Sincerity", verses: 4, type: "Makkah" },
      { id: 113, name: "Al-Falaq", ar: "الفلق", meaning: "The Daybreak", verses: 5, type: "Makkah" },
      { id: 114, name: "An-Nas", ar: "الناس", meaning: "Mankind", verses: 6, type: "Makkah" }
    ];

    let currentSurahId = 1;
    let readAyahsMap = JSON.parse(localStorage.getItem('quran_read_ayahs') || '{}');
    let currentWordAudio = new Audio();
    let currentVerseAudio = new Audio();
    let currentActiveWordEl = null;
    let lastActiveWordAudioUrl = null;

    /* IndexedDB Setup */
    const DB_NAME = 'NobleQuranCacheDB';
    const DB_VERSION = 1;
    let dbInstance = null;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('surahs')) {
            db.createObjectStore('surahs', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function getCachedSurah(id) {
      if (!dbInstance) await openDatabase();
      return new Promise((resolve) => {
        const tx = dbInstance.transaction('surahs', 'readonly');
        const store = tx.objectStore('surahs');
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    }

    async function saveCachedSurah(id, data) {
      if (!dbInstance) await openDatabase();
      const tx = dbInstance.transaction('surahs', 'readwrite');
      const store = tx.objectStore('surahs');
      store.put({ id, data });
    }

    /* DOM Selectors */
    const hudCard = document.getElementById('top-hud-card');
    const hudAr = document.getElementById('hud-ar');
    const hudTranslit = document.getElementById('hud-translit');
    const hudMeaning = document.getElementById('hud-meaning');
    const hudAudioReplay = document.getElementById('hud-audio-replay');
    const hudDismiss = document.getElementById('hud-dismiss');

    const hdrSurahNum = document.getElementById('hdr-surah-num');
    const hdrSurahName = document.getElementById('hdr-surah-name');
    const cardArTitle = document.getElementById('card-ar-title');
    const cardMeta = document.getElementById('card-meta');
    const bismillahText = document.getElementById('bismillah-text');
    const progressIndicator = document.getElementById('progress-indicator');
    const versesContainer = document.getElementById('verses-container');
    const loader = document.getElementById('loader');

    const surahModal = document.getElementById('surah-modal');
    const surahTrigger = document.getElementById('surah-trigger');
    const closeModal = document.getElementById('close-modal');
    const surahSearch = document.getElementById('surah-search');
    const surahList = document.getElementById('surah-list');
    const themeToggle = document.getElementById('theme-toggle');
    const jumpBtn = document.getElementById('jump-btn');

    /* Theme Initialization */
    const savedTheme = localStorage.getItem('quran_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('quran_theme', next);
    });

    hudAudioReplay.addEventListener('click', () => {
      if (lastActiveWordAudioUrl) {
        currentVerseAudio.pause();
        currentWordAudio.pause();
        currentWordAudio.src = lastActiveWordAudioUrl;
        currentWordAudio.play().catch(() => {});
      }
    });

    hudDismiss.addEventListener('click', () => {
      hudCard.style.display = 'none';
      if (currentActiveWordEl) {
        currentActiveWordEl.classList.remove('active-word');
        currentActiveWordEl = null;
      }
    });

    /* Strict Audio URL Resolver */
    function resolveWordAudioUrl(wordObj, surahId, verseNum) {
      if (wordObj.audio_url && wordObj.audio_url.trim() !== '') {
        return wordObj.audio_url.startsWith('http') 
          ? wordObj.audio_url 
          : `https://audio.qurancdn.com/${wordObj.audio_url}`;
      }
      
      // Fallback using exact Quranic location (Surah:Ayah:Word)
      if (wordObj.location) {
        const parts = wordObj.location.split(':');
        if (parts.length === 3) {
          const s = String(parts[0]).padStart(3, '0');
          const a = String(parts[1]).padStart(3, '0');
          const w = String(parts[2]).padStart(3, '0');
          return `https://audio.qurancdn.com/wbw/${s}_${a}_${w}.mp3`;
        }
      }

      // Fallback using word position
      if (wordObj.position) {
        const s = String(surahId).padStart(3, '0');
        const a = String(verseNum).padStart(3, '0');
        const w = String(wordObj.position).padStart(3, '0');
        return `https://audio.qurancdn.com/wbw/${s}_${a}_${w}.mp3`;
      }

      return null;
    }

    /* Load Surah Data */
    async function loadSurah(surahId) {
      currentSurahId = surahId;
      const meta = ALL_SURAHS.find(s => s.id === surahId);

      hdrSurahNum.textContent = meta.id;
      hdrSurahName.textContent = meta.name;
      cardArTitle.textContent = `سُورَةُ ${meta.ar}`;
      cardMeta.textContent = `${meta.name} • ${meta.verses} Verses • Revelation: ${meta.type}`;
      
      bismillahText.style.display = (surahId === 9 || surahId === 1) ? 'none' : 'block';

      versesContainer.innerHTML = '';
      loader.style.display = 'flex';
      updateProgressUI(meta.verses);

      let versesData = await getCachedSurah(surahId);

      if (!versesData) {
        try {
          const url = `https://api.quran.com/api/v4/verses/by_chapter/${surahId}?language=en&words=true&translations=20&per_page=300&word_fields=text_uthmani,transliteration,location,audio_url`;
          const res = await fetch(url);
          const json = await res.json();
          versesData = json.verses || [];
          if (versesData.length > 0) {
            await saveCachedSurah(surahId, versesData);
          }
        } catch (err) {
          console.error("Fetch error:", err);
        }
      }

      loader.style.display = 'none';

      if (!versesData || versesData.length === 0) {
        versesContainer.innerHTML = `
          <div style="text-align:center; padding:30px; color:var(--text-muted);">
            Unable to load verses. Check your internet connection to cache this chapter.
          </div>`;
        return;
      }

      renderVerses(versesData, meta.verses);
    }

    /* Render Verses to DOM */
    function renderVerses(verses, totalVerses) {
      versesContainer.innerHTML = '';

      verses.forEach(v => {
        const verseKey = v.verse_key;
        const verseNum = v.verse_number;
        const isRead = !!readAyahsMap[verseKey];
        const translationText = (v.translations && v.translations[0]) ? v.translations[0].text.replace(/<sup.*?<\/sup>/g, '') : '';

        const card = document.createElement('div');
        card.className = `ayah-card ${isRead ? 'read' : ''}`;
        card.id = `verse-${verseKey}`;

        const topBar = document.createElement('div');
        topBar.className = 'ayah-top-bar';
        topBar.innerHTML = `
          <span class="ayah-badge">${verseKey}</span>
          <div class="ayah-controls">
            <button class="recite-btn" data-audio-key="${verseKey}">▶ Recite</button>
            <button class="read-toggle-btn ${isRead ? 'is-read' : ''}" data-verse-key="${verseKey}">
              ${isRead ? '✓ Read' : 'Mark as Read'}
            </button>
          </div>
        `;

        const arLine = document.createElement('div');
        arLine.className = 'ayah-arabic';

        if (v.words && v.words.length > 0) {
          v.words.forEach(w => {
            if (w.char_type_name === 'end') {
              const endSpan = document.createElement('span');
              endSpan.className = 'ayah-end-symbol';
              endSpan.textContent = verseNum;
              arLine.appendChild(endSpan);
              return;
            }

            const wordSpan = document.createElement('span');
            wordSpan.className = 'q-word';
            wordSpan.textContent = w.text_uthmani || w.text;

            const translit = (w.transliteration && w.transliteration.text) ? w.transliteration.text : '';
            const meaning = (w.translation && w.translation.text) ? w.translation.text : '';
            const audioUrl = resolveWordAudioUrl(w, currentSurahId, verseNum);

            wordSpan.addEventListener('click', (e) => {
              e.stopPropagation();
              onWordClicked(wordSpan, w.text_uthmani || w.text, translit, meaning, audioUrl);
            });

            arLine.appendChild(wordSpan);
          });
        }

        const transDiv = document.createElement('div');
        transDiv.className = 'ayah-translation';
        transDiv.innerHTML = translationText;

        card.appendChild(topBar);
        card.appendChild(arLine);
        card.appendChild(transDiv);
        versesContainer.appendChild(card);
      });

      attachVerseControlListeners(totalVerses);
      updateProgressUI(totalVerses);
    }

    /* Word Click Handler: Syncs HUD & Plays Matching Audio */
    function onWordClicked(el, arText, translitText, meaningText, audioUrl) {
      if (currentActiveWordEl) {
        currentActiveWordEl.classList.remove('active-word');
      }
      currentActiveWordEl = el;
      el.classList.add('active-word');

      hudAr.textContent = arText;
      hudTranslit.textContent = translitText || '—';
      hudMeaning.textContent = meaningText || '—';
      hudCard.style.display = 'block';

      lastActiveWordAudioUrl = audioUrl;

      if (audioUrl) {
        currentVerseAudio.pause();
        currentWordAudio.pause();
        currentWordAudio.src = audioUrl;
        currentWordAudio.play().catch((err) => {
          console.warn("Audio playback issue:", err);
        });
      }
    }

    /* Verse Actions */
    function attachVerseControlListeners(totalVerses) {
      document.querySelectorAll('.read-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.verseKey;
          const card = document.getElementById(`verse-${key}`);
          const wasRead = !!readAyahsMap[key];

          if (wasRead) {
            delete readAyahsMap[key];
            btn.classList.remove('is-read');
            btn.textContent = 'Mark as Read';
            card.classList.remove('read');
          } else {
            readAyahsMap[key] = true;
            btn.classList.add('is-read');
            btn.textContent = '✓ Read';
            card.classList.add('read');
          }

          localStorage.setItem('quran_read_ayahs', JSON.stringify(readAyahsMap));
          updateProgressUI(totalVerses);
        });
      });

      document.querySelectorAll('.recite-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.audioKey;
          const [s, a] = key.split(':');
          const padS = String(s).padStart(3, '0');
          const padA = String(a).padStart(3, '0');
          const fullAyahAudio = `https://everyayah.com/data/Alafasy_128kbps/${padS}${padA}.mp3`;

          currentWordAudio.pause();
          currentVerseAudio.pause();
          currentVerseAudio.src = fullAyahAudio;
          btn.textContent = '⏸ Playing...';

          currentVerseAudio.play().catch(() => {
            btn.textContent = '▶ Recite';
          });

          currentVerseAudio.onended = () => {
            btn.textContent = '▶ Recite';
            if (!readAyahsMap[key]) {
              readAyahsMap[key] = true;
              localStorage.setItem('quran_read_ayahs', JSON.stringify(readAyahsMap));
              const card = document.getElementById(`verse-${key}`);
              if (card) card.classList.add('read');
              const readBtn = card ? card.querySelector('.read-toggle-btn') : null;
              if (readBtn) {
                readBtn.classList.add('is-read');
                readBtn.textContent = '✓ Read';
              }
              updateProgressUI(totalVerses);
            }
          };

          currentVerseAudio.onerror = () => {
            btn.textContent = '▶ Recite';
          };
        });
      });
    }

    function updateProgressUI(totalVerses) {
      let readCount = 0;
      for (let i = 1; i <= totalVerses; i++) {
        if (readAyahsMap[`${currentSurahId}:${i}`]) {
          readCount++;
        }
      }
      const pct = Math.round((readCount / totalVerses) * 100);
      progressIndicator.textContent = `${readCount} / ${totalVerses} Read (${pct}%)`;
    }

    function renderSurahModalList(filter = '') {
      surahList.innerHTML = '';
      const q = filter.trim().toLowerCase();

      ALL_SURAHS.forEach(s => {
        if (q && !s.name.toLowerCase().includes(q) && !s.meaning.toLowerCase().includes(q) && !String(s.id).includes(q)) {
          return;
        }

        const item = document.createElement('div');
        item.className = 'surah-list-item';
        item.innerHTML = `
          <div class="surah-list-left">
            <span class="surah-num-badge">${s.id}</span>
            <div class="surah-names-col">
              <span class="en-name">${s.name}</span>
              <span class="sub-info">${s.meaning} • ${s.verses} v</span>
            </div>
          </div>
          <span class="surah-ar-name">${s.ar}</span>
        `;

        item.addEventListener('click', () => {
          surahModal.classList.remove('open');
          loadSurah(s.id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        surahList.appendChild(item);
      });
    }

    surahTrigger.addEventListener('click', () => {
      surahSearch.value = '';
      renderSurahModalList();
      surahModal.classList.add('open');
      setTimeout(() => surahSearch.focus(), 150);
    });

    closeModal.addEventListener('click', () => surahModal.classList.remove('open'));
    surahModal.addEventListener('click', (e) => {
      if (e.target === surahModal) surahModal.classList.remove('open');
    });

    surahSearch.addEventListener('input', (e) => {
      renderSurahModalList(e.target.value);
    });

    jumpBtn.addEventListener('click', () => {
      const curMeta = ALL_SURAHS.find(s => s.id === currentSurahId);
      const vNum = prompt(`Enter Verse number (1 - ${curMeta.verses}):`);
      if (vNum) {
        const target = document.getElementById(`verse-${currentSurahId}:${parseInt(vNum)}`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          alert('Verse not found in this Surah.');
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      openDatabase().then(() => {
        loadSurah(1);
      });
    });
