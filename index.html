<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Noble Quran - Reader</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noble Quran">
  <meta name="theme-color" content="#064e3b">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Outfit:wght@300;400;500;600;700&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #064e3b;
      --primary-light: #047857;
      --accent-gold: #f59e0b;
      --accent-gold-light: #fef3c7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --read-tint: #ecfdf5;
      --read-border: #a7f3d0;
      --active-word: #fde68a;
      --active-word-border: #d97706;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --primary: #022c22;
      --primary-light: #065f46;
      --bg: #090d16;
      --surface: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --read-tint: #064e3b25;
      --read-border: #047857;
      --active-word: #78350f;
      --active-word-border: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding-top: calc(var(--safe-top) + 60px);
      padding-bottom: calc(var(--safe-bottom) + 80px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--safe-top) + 60px);
      padding-top: var(--safe-top);
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      padding-right: 16px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .surah-select-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      max-width: 200px;
    }

    .surah-select-trigger span.surah-num {
      background: var(--accent-gold);
      color: #000;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .icon-btn:active {
      background: rgba(255,255,255,0.2);
    }

    /* Pinned Top HUD: Transliteration + Meaning */
    #top-hud-card {
      position: sticky;
      top: calc(var(--safe-top) + 60px);
      z-index: 90;
      width: 100%;
      max-width: 680px;
      padding: 8px 16px;
      margin-bottom: 8px;
    }

    .hud-inner {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35), 0 0 12px rgba(245, 158, 11, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { transform: translateY(-12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .hud-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow: hidden;
    }

    .hud-top-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-arabic {
      font-family: 'Amiri Quran', serif;
      font-size: 26px;
      color: #fef08a;
      line-height: 1;
    }

    .hud-transliteration {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.3px;
    }

    .hud-meaning-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #f1f5f9;
      font-weight: 500;
    }

    .hud-meaning-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }

    .hud-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .hud-btn.audio-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .surah-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .surah-title-ar {
      font-family: 'Scheherazade New', serif;
      font-size: 34px;
      color: var(--primary-light);
      font-weight: 700;
    }

    .surah-meta {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-pill {
      background: var(--read-tint);
      color: var(--primary-light);
      border: 1px solid var(--read-border);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .bismillah {
      font-family: 'Amiri Quran', serif;
      font-size: 28px;
      color: var(--text-main);
      margin: 12px 0 4px;
      line-height: 1.8;
      text-align: center;
    }

    .ayah-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ayah-card.read {
      background: var(--read-tint);
      border-color: var(--read-border);
    }

    .ayah-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .ayah-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ayah-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recite-btn, .read-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .read-toggle-btn.is-read {
      background: var(--primary-light);
      color: white;
      border-color: var(--primary-light);
    }

    .ayah-arabic {
      direction: rtl;
      font-family: 'Amiri Quran', serif;
      font-size: 29px;
      line-height: 2.1;
      text-align: right;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      row-gap: 6px;
    }

    .q-word {
      display: inline-block;
      padding: 0 6px;
      margin: 0 1px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 2px solid transparent;
      user-select: none;
    }

    .q-word:active {
      transform: scale(0.96);
    }

    .q-word.active-word {
      background: var(--active-word);
      border-bottom: 2px solid var(--active-word-border);
      color: #000;
    }

    [data-theme="dark"] .q-word.active-word {
      color: #fff;
    }

    .ayah-end-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-gold);
      color: var(--accent-gold);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      margin-right: 6px;
      vertical-align: middle;
    }

    .ayah-translation {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 400;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-height: 85vh;
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .surah-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .surah-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .surah-list-item:active {
      background: var(--bg);
    }

    .surah-list-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .surah-num-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .surah-names-col {
      display: flex;
      flex-direction: column;
    }

    .surah-names-col .en-name {
      font-size: 15px;
      font-weight: 600;
    }

    .surah-names-col .sub-info {
      font-
